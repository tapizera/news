<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b0714">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notícias"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Notícias no Brasil</title>
<style>
:root{--bg:#0b0714;--card:#150e26;--card2:#1c1333;--line:#2c2150;--p:#8b5cf6;--p2:#c084fc;--tx:#ede9fe;--mu:#9b92b8;--ok:#34d399}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;color:var(--tx);background:radial-gradient(800px 420px at 10% -10%,#3b1a7a66,transparent),radial-gradient(600px 360px at 100% 0,#7c3aed33,transparent),var(--bg);
 display:flex;flex-direction:column;height:100dvh;padding:max(12px,env(safe-area-inset-top)) 12px 0}
header{display:flex;align-items:baseline;gap:10px;padding:2px 4px 10px}
h1{font-size:clamp(18px,3.4vw,28px);letter-spacing:-.02em;background:linear-gradient(90deg,#fff,var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
header span{font-size:12px;color:var(--mu)}h1{white-space:nowrap}@media(max-width:520px){header span{display:none}}
main{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:clamp(6px,1.4vw,14px);max-width:1000px;width:100%;margin:0 auto}
.card{position:relative;min-height:0;min-width:0;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:clamp(12px,2vw,20px);padding:clamp(8px,1.6vw,16px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1vh,10px);cursor:pointer;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.card:hover,.card:active{border-color:var(--p);box-shadow:0 8px 30px #7c3aed40}
.pos{position:absolute;left:8px;top:2px;font-size:clamp(20px,5vh,40px);font-weight:800;color:#ffffff14;line-height:1.1}
.ico{width:clamp(40px,min(13vw,11vh),84px);aspect-ratio:1;border-radius:22%;overflow:hidden;background:linear-gradient(135deg,var(--p),#4c1d95);display:grid;place-items:center;font-weight:800;font-size:clamp(14px,4vw,26px);color:#fff;flex:none;box-shadow:0 6px 18px #0008}
.ico img{width:100%;height:100%;display:block}
.nm{font-size:clamp(11px,1.5vw,16px);font-weight:700;text-align:center;line-height:1.2;max-width:100%}
.rk{display:flex;gap:5px;width:100%;justify-content:center}
.rk div{flex:1;max-width:84px;border:1px solid var(--line);background:#00000030;border-radius:9px;padding:3px 2px;text-align:center;transition:.2s}
.rk div.act{border-color:var(--p);background:#8b5cf630}
.rk small{display:block;font-size:clamp(7px,1.1vw,10px);letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.rk b{font-size:clamp(12px,2vw,18px)}
.yr{font-size:clamp(9px,1.2vw,12px);color:var(--mu)}
.yr.act{color:var(--p2);font-weight:700}
.live{position:absolute;right:8px;top:8px;width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
nav{flex:none;max-width:1000px;width:100%;margin:10px auto 0;padding:10px 10px calc(10px + env(safe-area-inset-bottom));display:flex;gap:6px;align-items:center;background:#ffffff0a;border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;backdrop-filter:blur(10px)}
nav .l{font-size:10px;letter-spacing:.1em;color:var(--mu);text-transform:uppercase;margin-right:2px;display:none}
.b{flex:1;border:1px solid var(--line);background:transparent;color:var(--tx);padding:11px 4px;border-radius:12px;font-size:clamp(11px,3vw,14px);cursor:pointer;transition:.2s;font-family:inherit}
.b.on{background:linear-gradient(135deg,var(--p),#6d28d9);border-color:transparent;box-shadow:0 4px 16px #7c3aed66}
.b.dir{flex:0 0 auto;padding:11px 14px;color:var(--p2)}
@media(min-width:700px){nav .l{display:block}}
#ov{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:9;backdrop-filter:blur(3px)}
#ov.show{display:flex}
#sh{width:100%;max-width:560px;max-height:82dvh;overflow:auto;background:linear-gradient(170deg,#241846,#120b22);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(min-width:700px){#ov{align-items:center}#sh{border-radius:22px}}
.hd{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.hd .ico{width:58px;font-size:20px}
.hd h2{font-size:20px}
.ch{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.ch span{font-size:12px;color:var(--mu);border:1px solid var(--line);padding:4px 10px;border-radius:8px}
.ch .g{color:var(--ok);border-color:#34d39955}
#sh p{font-size:14px;line-height:1.55;color:#d6cff0;margin-top:8px}
#sh p.m{color:var(--mu);font-size:13px}
#x{float:right;background:none;border:0;color:var(--mu);font-size:22px;cursor:pointer;margin-top:-6px}
</style></head><body>

const KEYS={c:"Confiab.",a:"Audiência",y:"Fundação",n:"Nome"};
let key="c",asc=true;
const $=i=>document.getElementById(i);
const ini=n=>n.replace(/[^A-Za-zÀ-ú ]/g,"").split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const icon=d=>d.i?`<img src="${IMG[d.i]}" alt="${d.n}">`:ini(d.n);
const cards=D.map(d=>{
  const e=document.createElement("div");e.className="card";
  e.innerHTML=`<div class="pos"></div>${d.h?'<i class="live"></i>':''}<div class="ico">${icon(d)}</div><div class="nm">${d.n}</div>
  <div class="rk"><div data-k="c"><small>Confiab.</small><b>${d.c}º</b></div><div data-k="a"><small>Audiência</small><b>${d.a?d.a+"º":"—"}</b></div></div>
  <div class="yr" data-k="y">📅 ${d.y}</div>`;
  e.onclick=()=>open(d);$("g").appendChild(e);return{d,e};
});
function cmp(x,y){let A=x.d[key==="n"?"n":key],B=y.d[key==="n"?"n":key];
  if(A==null&&B==null)return 0;if(A==null)return 1;if(B==null)return -1;
  const r=typeof A==="string"?A.localeCompare(B,"pt"):A-B;return asc?r:-r;}
function render(anim){
  const old=new Map(cards.map(c=>[c,c.e.getBoundingClientRect()]));
  const s=[...cards].sort(cmp);
  s.forEach((c,i)=>{$("g").appendChild(c.e);c.e.querySelector(".pos").textContent=i+1;
    c.e.querySelectorAll("[data-k]").forEach(n=>n.classList.toggle("act",n.dataset.k===key));});
  if(anim)s.forEach(c=>{const a=old.get(c),b=c.e.getBoundingClientRect(),dx=a.left-b.left,dy=a.top-b.top;
    if(dx||dy)c.e.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:"none"}],{duration:420,easing:"cubic-bezier(.2,.8,.2,1)"});});
  $("k").innerHTML=Object.entries(KEYS).map(([k,v])=>`<button class="b ${k===key?"on":""}" data-k="${k}">${v}</button>`).join("");
  $("d").textContent=asc?"↑":"↓";
}
$("k").onclick=e=>{const b=e.target.closest("[data-k]");if(b){key=b.dataset.k;render(1)}};
$("d").onclick=()=>{asc=!asc;render(1)};
function open(d){
  $("sh").innerHTML=`<button id="x">×</button><div class="hd"><div class="ico">${icon(d)}</div><div><h2>${d.n}</h2></div></div>
  <div class="ch"><span>🛡️ Confiabilidade ${d.c}º</span><span>📊 Audiência ${d.a?d.a+"º":"—"}</span><span>📅 ${d.f}</span><span>👥 ${d.p}</span>${d.h?'<span class="g">● 24h</span>':''}</div>
  <p>${d.foco||"Sem descrição cadastrada."}</p>${d.perfil?`<p class="m">${d.perfil}</p>`:""}<p class="m">📺 ${d.pl}</p>`;
  $("ov").classList.add("show");
}
$("ov").onclick=e=>{if(e.target.id==="ov"||e.target.id==="x")$("ov").classList.remove("show")};
document.onkeydown=e=>{if(e.key==="Escape")$("ov").classList.remove("show")};
render(0);
</script><script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));</script></body></html>
